<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>DHC | Page not found</title>
  <link rel="icon" type="image/gif" href="data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7">
  <!-- Self-contained on purpose: this page can be served from any depth, so it cannot count on relative files. -->
  <style>
    :root { color-scheme: dark; background: #1a1a18; color: #f0ebe3; font-family: system-ui, sans-serif; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; min-height: 100dvh; display: grid; place-items: center; user-select: none; -webkit-user-select: none; }
    main { width: min(100%, 34rem); padding: 2rem; }
    .code { margin: 0 0 1.25rem; color: #ecd078; font-size: 12px; font-weight: 500; letter-spacing: .12em; }
    h1 { margin: 0 0 1rem; font-size: clamp(32px, 6vw, 48px); font-weight: 600; line-height: 1.1; letter-spacing: -.035em; }
    p { margin: 0; color: #aaa69f; font-size: 15px; line-height: 1.6; }
    a { color: #ecd078; text-decoration: none; }
    #home { display: inline-block; margin-top: 2rem; padding-bottom: 5px; font-size: 13px; border-bottom: 1px solid #ecd07855; }
    a:focus-visible { outline: 1px solid currentColor; outline-offset: 6px; }
    .credit { display: flex; flex-wrap: wrap; gap: 4px 14px; margin-top: 4.5rem; color: #f0ebe361; font-size: 11px; letter-spacing: .025em; }
    .credit a { color: inherit; }
    .credit a:hover { color: #f0ebe3c7; }
    @media (prefers-color-scheme: light) {
      :root { color-scheme: light; background: #f5f0e8; color: #1a1a18; }
      p { color: #68645e; }
      .code, a { color: #8c6a1d; }
      #home { border-bottom-color: #8c6a1d55; }
      .credit { color: #1a1a1870; }
      .credit a:hover { color: #1a1a18c7; }
    }
  </style>
</head>
<body>
  <main>
    <p class="code">404</p>
    <h1>This page isn’t here.</h1>
    <p id="status" role="status">Taking you back to the site.</p>
    <a id="home" href="/index.html?v=d">Return to the site</a>
    <p class="credit"><span>© <span id="year">2026</span> Dhruv Heith Chheda</span><a href="https://github.com/aamosm/heith.me?tab=MIT-1-ov-file" target="_blank" rel="noopener">MIT License</a></p>
  </main>
  <script>
    (() => {
      ['contextmenu', 'dragstart', 'dragover', 'drop'].forEach(type => {
        document.addEventListener(type, event => event.preventDefault(), { capture: true });
      });

      const year = new Date().getFullYear();
      if (year > 2026) document.getElementById('year').textContent = '2026–' + year;

      // Walk up from the missing address and look for the landing page, which carries a marker tag.
      // That finds home whether the site sits at a domain root or under a repository path.
      const parts = location.pathname.split('/').filter(Boolean);
      if (parts.length && /\.[^/]+$/.test(parts.at(-1))) parts.pop();
      const bases = Array.from({ length: parts.length + 1 }, (_, index) => {
        const prefix = parts.slice(0, parts.length - index).join('/');
        return prefix ? '/' + prefix + '/' : '/';
      });
      const controllers = [];
      const checks = bases.map(async base => {
        const controller = new AbortController();
        controllers.push(controller);
        const timeout = setTimeout(() => controller.abort(), 1800);
        try {
          const response = await fetch(new URL(base + 'index.html', location.origin), { signal: controller.signal, credentials: 'same-origin' });
          if (!response.ok || new URL(response.url).origin !== location.origin) return null;
          const page = new DOMParser().parseFromString(await response.text(), 'text/html');
          if (!page.querySelector('meta[name="dhc-site-root"][content="true"]')) return null;
          const home = new URL(response.url);
          if (!home.pathname.endsWith('/index.html')) home.pathname = home.pathname.replace(/\/?$/, '/') + 'index.html';
          home.search = '?v=d';
          home.hash = '';
          return home;
        } catch {
          return null;
        } finally {
          clearTimeout(timeout);
        }
      });

      (async () => {
        const status = document.getElementById('status');
        for (const check of checks) {
          const home = await check;
          if (!home) continue;
          controllers.forEach(controller => controller.abort());
          document.getElementById('home').href = home.href;
          if (location.pathname !== home.pathname) location.replace(home.href);
          else status.textContent = 'The homepage is unavailable. Please try again shortly.';
          return;
        }
        status.textContent = 'The site could not be reached. Use the link below to try again.';
      })();
    })();
  </script>
</body>
</html>
